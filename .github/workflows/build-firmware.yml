# GitHub Actions Workflow: 云端构建 AI Passport 桌面索引固件
#
# 关键修复（2026-10-08）:
#   - action 参数用 path（不是 project_dir）
#   - build + merge 都通过 action 的 command 在 Docker 容器里跑（不依赖 $IDF_PATH）
#   - merged-binary.bin 拷贝回 runner 才能 artifact upload

name: Build AI Passport Firmware

on:
  push:
    branches: [main]
    paths:
      - 'sdk-source/**'
      - '02-sdk/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

env:
  ESP_IDF_VERSION: v5.5.3
  ESP_TARGET: esp32c3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📋 Inject our play into sdk-source/main
        run: |
          set -e
          cd sdk-source
          
          # 1. 备份官方 demo main.c（AGENTS.md 禁止复用）
          if [ -f main/main.c ]; then
            mv main/main.c main/main.c.demo_backup
            echo "✅ 备份 main.c → main.c.demo_backup"
          fi

          # 2. 复制我们的 C 玩法
          cp ../02-sdk/desktop_index_player.c main/desktop_index_player.c
          cp ../02-sdk/desktop_index_player.h main/desktop_index_player.h
          echo "✅ 复制 desktop_index_player.{c,h}"

          # 3. 复制 main.c（用独立文件避免 heredoc 转义问题）
          cp ../02-sdk/main.c main/main.c
          echo "✅ 复制 main.c"

          # 4. 修改 CMakeLists.txt 加入我们的 C 源文件 + 启用 HTTP client 组件
          if grep -q "desktop_index_player" main/CMakeLists.txt; then
            echo "✅ CMakeLists.txt 已包含 desktop_index_player"
          else
            # 加入 desktop_index_player.c
            sed -i 's|SRCS "main.c"|SRCS "main.c"\n         "desktop_index_player.c"|' main/CMakeLists.txt
            # 启用 esp_http_client 组件
            sed -i 's|REQUIRES bsp bt esp_event esp_hw_support esp_netif esp_timer esp_wifi nvs_flash|REQUIRES bsp bt esp_event esp_hw_support esp_netif esp_timer esp_wifi nvs_flash esp_http_client cJSON json|; s|REQUIRES bsp esp_event esp_hw_support esp_netif esp_timer esp_wifi nvs_flash|REQUIRES bsp esp_event esp_hw_support esp_netif esp_timer esp_wifi nvs_flash esp_http_client cJSON json|' main/CMakeLists.txt
            echo "✅ CMakeLists.txt 已加 desktop_index_player.c + esp_http_client + cJSON"
          fi

      # ⭐ 关键步骤：用 action 的 command 在容器里跑完整 build+merge
      # action 内部：docker run espressif/idf:v5.5.3 /bin/bash -c 'command'
      # command 在容器里执行，路径相对于 path 输入（这里是 sdk-source/）
      - name: 🔨 Build + merge firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          target: ${{ env.ESP_TARGET }}
          path: 'sdk-source'
          command: |
            set -e
            idf.py set-target esp32c3
            idf.py build
            echo "=== Build success, merging ==="
            python3 $IDF_PATH/components/esptool_py/esptool/esptool.py \
              --chip esp32c3 \
              merge_bin \
              --output merged-binary.bin \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 8MB \
              0x0 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x10000 build/ai_passport.bin
            ls -lh merged-binary.bin
            # 拷贝到 runner workspace（容器外）
            cp merged-binary.bin /app/${{ github.repository }}/merged-binary.bin
            echo "=== Merged binary copied to workspace ==="

      - name: 📤 Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-desktop-index-firmware
          path: merged-binary.bin
          retention-days: 90
        if: success()

      - name: 🚀 Create Release (on push only)
        if: github.event_name == 'push' && success()
        uses: softprops/action-gh-release@v2
        with:
          files: merged-binary.bin
          tag_name: firmware-${{ github.run_number }}
          name: "AI Passport Desktop Index v${{ github.run_number }}"
          body: |
            自动构建的 AI Passport 桌面索引固件

            **刷机方法**:
            1. 下载 `merged-binary.bin`
            2. 打开 https://ai-passport.folotoy.cn/tools/web-flasher/
            3. 选择文件 → 连接 AI Passport → 烧录

            **首次使用**:
            1. 烧完重启设备
            2. 长按 OK 进入配网模式（如 NVS 没存过 WiFi）
            3. 连接设备热点 → 浏览器填 WiFi 密码
            4. 设备自动拉 GitHub Pages 上的 desktop_index.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
